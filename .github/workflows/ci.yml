name: CI

# Skeleton CI — adapt the toolchain setup to your stack. The verification command is wired from
# your harness answers; the language/runtime setup is yours to fill in.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # TODO: set up your language/runtime and install dependencies here
      # (e.g. actions/setup-node, pnpm/action-setup, actions/setup-go, …).

      - name: Verify
        run: npm test --workspaces --if-present
